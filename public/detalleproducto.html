<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Producto - AgroVeterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/paginas/detalleproducto.css">
</head>
<body>

<header class="main-header shadow-sm">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
        <a href="/" class="text-decoration-none">
            <img src="/img/logo-alivet.jpg" alt="Logo" style="height:70px;">
        </a>
        <div class="d-flex gap-4 align-items-center">
            <a href="/carrito.html" class="text-white position-relative">
                <i class="bi bi-cart3 fs-4"></i>
                <span id="cart-count" class="badge-carrito">0</span>
            </a>
            <a href="/login.html" class="text-white" id="btn-usuario">
                <i class="bi bi-person-circle fs-4"></i>
            </a>
        </div>
    </div>
</header>

<main class="container my-5">
    <div id="producto-detalle" class="row g-4">
        <div class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p>Cargando producto...</p>
        </div>
    </div>

    <h4 class="text-success mt-5 mb-3 border-bottom pb-2">Productos que te pueden interesar</h4>
    <div class="row g-4" id="productos-recomendados">
        <div class="text-center py-3">
            <div class="spinner-border text-success" role="status"></div>
        </div>
    </div>
</main>

<script src="/js/producto.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const token = localStorage.getItem('token');
        const btn = document.getElementById('btn-usuario');
        if (btn && token) btn.href = '/perfil.html';
    })();
</script>
</body>
</html>
