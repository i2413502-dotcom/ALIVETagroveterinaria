<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código - AgroVeterinaria ALIVET</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4 text-center">
                        <h4 class="mb-3">Verifica tu correo</h4>
                        <p class="text-muted">Ingresa el código de 6 dígitos que enviamos a tu correo.</p>
                        <input type="text" id="otp" class="form-control form-control-lg text-center mb-3" 
                               placeholder="000000" maxlength="6" pattern="\d{6}">
                        <button class="btn btn-success w-100 mb-2" data-accion="verificar-otp">Verificar código</button>
                        <button class="btn btn-link btn-sm" data-accion="reenviar-otp">Reenviar código</button>
                        <p id="mensaje" class="mt-2"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/verify-otp.js"></script>
</body>
</html>
